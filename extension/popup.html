<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px/1.45 -apple-system, system-ui, sans-serif; margin: 0; width: 320px; color: #1f2328; }
    header { padding: 10px 12px; background: #0969da; color: #fff; font-weight: 600; }
    .body { padding: 12px; }
    .tab { font-size: 12px; color: #57606a; margin-bottom: 8px; word-break: break-word; }
    .tab b { color: #1f2328; }
    label { display: block; font-size: 12px; color: #57606a; margin: 8px 0 3px; }
    input, select { width: 100%; box-sizing: border-box; font: inherit; padding: 5px 7px; border: 1px solid #d0d7de; border-radius: 6px; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    button { font: inherit; padding: 6px 10px; border: 1px solid #d0d7de; border-radius: 6px; background: #f6f8fa; cursor: pointer; flex: 1; }
    button.primary { background: #1f883d; border-color: #1f883d; color: #fff; }
    .msg { margin-top: 8px; font-size: 12px; min-height: 16px; }
    .msg.ok { color: #1a7f37; } .msg.err { color: #cf222e; }
    a.manager { display: block; margin-top: 10px; font-size: 12px; }
  </style>
</head>
<body>
  <header>Bookmark Manager</header>
  <div class="body">
    <div class="tab" id="tab">Reading current tab…</div>
    <label for="title">Name</label>
    <input id="title" type="text">
    <label for="folder">Folder</label>
    <select id="folder"></select>
    <div class="row">
      <button class="primary" id="add">Add bookmark</button>
    </div>
    <div class="msg" id="msg"></div>
    <a class="manager" href="#" id="open">Open full manager →</a>
  </div>
  <script src="lib/bookmarks.js"></script>
  <script src="popup.js"></script>
</body>
</html>
