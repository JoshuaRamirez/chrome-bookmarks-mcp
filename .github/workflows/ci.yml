name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: Build bundle
        run: npm run build

      - name: Verify committed bundle is up to date
        run: |
          if ! git diff --exit-code -- dist/bundle.cjs; then
            echo "::error::dist/bundle.cjs is stale. Run 'npm run build' and commit the result."
            exit 1
          fi

      - name: Smoke test
        run: npm test
