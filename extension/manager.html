<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bookmark Manager</title>
  <link rel="stylesheet" href="manager.css">
</head>
<body>
  <header>
    <h1>Bookmark Manager</h1>
    <span class="stats" id="stats"></span>
    <span class="spacer"></span>
    <input type="search" id="search" placeholder="Search bookmarks…">
  </header>

  <div class="toolbar">
    <button id="newFolder">New folder</button>
    <button id="newBookmark">Add bookmark</button>
    <button id="dedupe">Find duplicates</button>
    <button id="export">Export JSON</button>
    <button id="import">Import JSON</button>
    <button id="refresh">Refresh</button>
  </div>

  <div id="tree"></div>
  <div id="modalRoot"></div>

  <script src="lib/bookmarks.js"></script>
  <script src="manager.js"></script>
</body>
</html>
